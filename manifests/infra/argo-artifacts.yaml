# 1. Secret with GCS Credentials (SANITIZED)
apiVersion: v1
kind: Secret
metadata:
  name: my-gcs-cred
  namespace: argo
type: Opaque
stringData:
  serviceAccountKey: |
    {
      "type": "service_account",
      "project_id": "YOUR_PROJECT_ID_HERE",
      "private_key": "-----BEGIN PRIVATE KEY-----\nREPLACE_ME_WITH_REAL_KEY\n-----END PRIVATE KEY-----\n",
      "client_email": "mlaas-storage-sa@..."
    }

---
# 2. ConfigMap linking Argo to GCS
apiVersion: v1
kind: ConfigMap
metadata:
  name: artifact-repositories
  namespace: argo
  annotations:
    workflows.argoproj.io/default-artifact-repository: default-v1
data:
  default-v1: |
    archiveLogs: true
    gcs:
      bucket: my-ml-bucket-117  # Your real bucket name is fine to keep here (it's not a secret)
      keyFormat: "{{workflow.name}}/{{pod.name}}"
      serviceAccountKeySecret:
        name: my-gcs-cred
        key: serviceAccountKey